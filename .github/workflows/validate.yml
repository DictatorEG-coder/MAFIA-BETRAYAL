name: Validate MAFIA: BETRAYAL

on:
  push:
    branches:
      - feature/button-first-gameplay
  pull_request:
    branches:
      - main
      - feature/button-first-gameplay

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
